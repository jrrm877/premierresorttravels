name: Prepare responsive homepage images
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=11,<13'
      - name: Generate optimized image variants
        run: python scripts/optimize-home-images.py
      - name: Open review PR with optimized assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="perf/homepage-webp-assets"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add public/images/home-style-*-480.webp public/images/home-style-*-960.webp
          if git diff --cached --quiet; then
            echo "No changes to optimized images"
            exit 0
          fi
          git commit -m "perf: generate responsive WebP travel-style images"
          git push --force-with-lease origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "perf: add responsive homepage WebP images" --body "Generated 480px and 960px WebP variants from existing homepage travel-style photos. Source images remain unchanged. Merge together with responsive image markup once verified."

name: Update photo importer lockfile
on:
  workflow_dispatch:
  push:
    branches:
      - feat/advisor-photo-import
    paths:
      - .github/workflows/update-photo-import-lockfile.yml
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/advisor-photo-import
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Update lockfile for photo ZIP importer"
            git push origin HEAD:feat/advisor-photo-import
          fi
